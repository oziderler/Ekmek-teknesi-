name: Seviye Botu

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seviye-botu
  cancel-in-progress: false

jobs:
  calistir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Botu calistir
        run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MANUEL: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "seviye-botu"
          git config user.email "seviye-botu@users.noreply.github.com"
          git add state.json 2>/dev/null || exit 0
          git diff --staged --quiet || (git commit -m "durum guncellendi" && git pull --rebase && git push)
